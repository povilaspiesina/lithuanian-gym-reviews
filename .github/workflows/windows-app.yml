name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: npm ci
      - name: Bundle Chromium
        shell: pwsh
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path (Get-Location) 'bundle-browsers'
          npx playwright install chromium --no-shell
      - name: Build dashboard executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --noconfirm --clean --onefile --name review_app --add-data 'gyms_lt.json;.' review_app.py
      - name: Test source
        shell: pwsh
        run: |
          npm test
          python -m unittest -q test_review_app.py
      - name: Build installer and zip
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test bundled runtime
        shell: pwsh
        run: |
          $root = Join-Path (Get-Location) 'release/win-unpacked'
          $backend = Join-Path $root 'resources/backend/review_app.exe'
          $browser = Join-Path $root 'resources/browsers/chromium-1243/chrome-win64/chrome.exe'
          if (!(Test-Path $backend)) { throw 'Bundled dashboard executable is missing' }
          if (!(Test-Path $browser)) { throw 'Bundled browser is missing' }
          $env:GYM_DATA_DIR = Join-Path $env:RUNNER_TEMP 'gym-review-smoke'
          $env:GYM_DIRECTORY_FILE = Join-Path $root 'resources/gyms_lt.json'
          $env:GYM_PLACES_FILE = Join-Path $root 'resources/verified_maps_places.json'
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $root 'resources/browsers'
          & $backend status
          if ($LASTEXITCODE -ne 0) { throw 'Bundled dashboard failed' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & (Join-Path $root 'Lithuanian Gym Reviews.exe') (Join-Path $root 'resources/app.asar/maps_scraper.js') status
          if ($LASTEXITCODE -ne 0) { throw 'Bundled collector failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Lithuanian-Gym-Reviews-Windows
          path: |
            release/*.exe
            release/*.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
